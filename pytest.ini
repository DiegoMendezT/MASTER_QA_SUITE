[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -n auto
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: Smoke tests for critical functionality
    regression: Full regression test suite
    slow: Tests that take a long time to run
    self_reflection: Meta-tests that validate the framework itself
    stress: Stress testing for system limits
    benchmark: Benchmarking tests for performance baselines
    ui: marks tests as UI tests
    api: marks tests as API tests
    integration: marks tests as integration tests (UI + API)
    a11y: marks tests as accessibility tests
    perf: marks tests as performance tests (includes performance, load, and benchmark testing)
    auth: marks tests as authentication tests
    security: marks tests as security tests
    external: marks tests that depend on external services
    serial: marks tests that are not safe to run in parallel
    profile: Tests for the user profile page
    visual: marks tests as visual regression tests
    playwright: marks tests as playwright tests
minversion = 6.0

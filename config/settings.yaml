# MASTER QA SUITE Configuration v2.0

# Feature Flags - Toggle advanced framework features
# See conftest.py for implementation details.
feature_flags:
  QA_FEATURE_CDP_LOGS: false # Enable/disable Chrome DevTools Protocol logging
  QA_FEATURE_CACHE_API_CALLS: true # Enable/disable caching for external API calls

# Selenium WebDriver settings
selenium:
  implicit_wait: 10
  page_load_timeout: 30
  script_timeout: 30
  page_load_strategy: "eager" # normal, eager, none

# Test URLs for Applications Under Test (AUTs)
urls:
  the_internet: "https://the-internet.herokuapp.com"
  sauce_demo: "https://www.saucedemo.com"

# User credentials for various test scenarios
users:
  sauce_standard_user:
    username: "standard_user"
    password: "secret_sauce"
  
# API endpoints and settings
apis:
  httpbin: "https://httpbin.org"
  jsonplaceholder: "https://jsonplaceholder.typicode.com"
  # Optional: Add a local mock server URL here
  # local_mock: "http://127.0.0.1:8000"

# Browser settings
browsers:
  chrome:
    headless: false
    window_size: "1920,1080"
  firefox:
    headless: false
    window_size: "1920,1080"
  edge:
    headless: false
    window_size: "1920,1080"

# Test environment
environment: "local"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"


name: tests

on:
  push:
    branches: [ main ]
    paths-ignore: [ "docs/**", "**/*.md" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.engine }} • ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: selenium,  browser: chrome,   marker: "not visual and not external", browser_flag: "" }
          - { engine: selenium,  browser: firefox,  marker: "not visual and not external", browser_flag: "" }
          - { engine: playwright, browser: chromium, marker: "not visual and not external", browser_flag: "" }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements/base.txt
            requirements/core-tests.txt
            requirements/dev.txt
            requirements/ui.txt
            requirements/visual.txt
            requirements/data.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/core-tests.txt
          pip install -r requirements/dev.txt
          pip install -r requirements/ui.txt
          pip install -r requirements/visual.txt
          pip install -r requirements/data.txt

      - name: Install Playwright browsers (only when needed)
        if: matrix.engine == 'playwright'
        run: |
          python -m playwright install --with-deps

      - name: Consistency check (fast)
        run: |
          python -m tools.consistency_check

      - name: Run tests
        env:
          # Optional; if not set, tests already avoid externals via marker above
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: |
          mkdir -p reports artifacts
          pytest -n auto \
            -m "${{ matrix.marker }}" \
            --engine "${{ matrix.engine }}" \
            --browser "${{ matrix.browser }}" \
            --maxfail=1 --dist loadscope \
            --html=reports/report.html --self-contained-html

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.engine }}
          path: reports/report.html

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.engine }}-${{ matrix.browser }}
          path: |
            artifacts/**
            allure-results/**
          if-no-files-found: ignore

name: Trinus demo smoke

on:
  push:
    branches: [ feature/trinus-demo ]
  workflow_dispatch:

jobs:
  trinus-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/core-tests.txt
          pip install -r requirements/ui.txt

      - name: Run Trinus Streamlit smoke tests
        run: |
          python -m pytest tests/selenium -q
